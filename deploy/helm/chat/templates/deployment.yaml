apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat.fullname" . }}
  labels: {{- include "chat.labels" . | nindent 4 }}
spec:
  # One process owns the database file and the realtime connections.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "chat.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "chat.selector" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "3000"
            {{- if .Values.publicUrl }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "chat.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
