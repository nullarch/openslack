# Fly.io: https://fly.io/docs/reference/configuration/
#   fly launch --no-deploy --copy-config     (pick an app name and region)
#   fly volumes create data --size 5
#   fly secrets set PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
# Keep exactly one machine: the database is a file on the volume.
app = "change-me"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Realtime connections and app deliveries need the process to stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
